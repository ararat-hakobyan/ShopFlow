<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          crossorigin="anonymous" />
    <link rel="stylesheet" href="css/site.css" />
    <title>Sign in &middot; ShopFlow</title>
</head>
<body>
    <header data-sf-header></header>

    <main class="container py-4">
        <div data-sf-alerts></div>

<div class="sf-card sf-auth-card">
    <div class="sf-card-body">
        <h1 class="sf-page-title mb-1">Welcome back</h1>
        <p class="sf-page-subtitle mb-4">Sign in to continue to your ShopFlow account.</p>

        <form id="login-form" novalidate>
            <div class="validation-summary-errors mb-3" data-validation-summary></div>

            <div class="mb-3">
                <label for="Email" class="form-label">Email address</label>
                <input id="Email" name="Email" class="form-control" type="email" autocomplete="username"
                       placeholder="name@example.com" />
                <span class="field-validation-error" data-validation-for="Email"></span>
            </div>

            <div class="mb-4">
                <label for="Password" class="form-label">Password</label>
                <input id="Password" name="Password" class="form-control" type="password" autocomplete="current-password" />
                <span class="field-validation-error" data-validation-for="Password"></span>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
            </button>
        </form>

        <p class="sf-muted small text-center mt-4 mb-0">
            No account yet?
            <a href="register.html">Create one</a>
        </p>
    </div>
</div>
    </main>

    <footer data-sf-footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="js/config.js"></script>
    <script src="js/format.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
